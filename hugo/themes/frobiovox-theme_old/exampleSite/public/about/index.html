<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hugo Site</title>
    <meta name="description" content="A blog using the Frobiovox theme">
    
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Cutive+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">

    
    
</head>
<body>
    <div class="not-footer">
        <div class="wrapper-masthead">
    <div class="container">
        <header class="masthead clearfix">
            
            <a href="/" class="site-avatar"><img src="/images/avatar.png" /></a>
            

            <div class="site-info">
                <h1 class="site-name"><a href="/">My Hugo Site</a></h1>
                
                <p class="site-description">A blog using the Frobiovox theme</p>
                
            </div>
        </header>

        <nav>
            
            <a href="/">Blog</a>
            
            <a href="/about/">About</a>
            
        </nav>
    </div>
</div>

        <main>
            
<div class="container">
    <article class="post">
        <h1>About</h1>
        <div class="date">January 10, 2024</div>

            <p>This is an example about page for the Frobiovox Hugo theme.</p>
<p>The theme replicates the design and styling of <a href="https://www.frobiovox.com">www.frobiovox.com</a>.</p>

    </article>
</div>

        </main>
    </div>
    <div class="wrapper-footer">
    <div class="container">
        <footer>
            <div class="social-icons">
                <h3>Social Networks</h3>
                
                <a href="https://github.com/yourusername">GitHub</a><br>
                
                
                <a href="https://twitter.com/yourusername">Twitter</a><br>
                
                <a href="/index.xml">RSS</a>
            </div>

            
            <div class="blogroll">
                <h3>Blogroll</h3>
                
                <a href="https://example.com">Example Blog</a><br>
                
            </div>
            

            <div class="copyright">
                <p>&copy; 2026 My Hugo Site</p>
            </div>
        </footer>
    </div>
</div>

    <script src="/js/links.js"></script>

    
    
</body>
</html>
