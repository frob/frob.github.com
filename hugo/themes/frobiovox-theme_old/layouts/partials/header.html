<div class="wrapper-masthead">
    <div class="container">
        <header class="masthead clearfix">
            {{ with .Site.Params.avatar }}
            <a href="{{ "/" | relURL }}" class="site-avatar"><img src="{{ . }}" /></a>
            {{ end }}

            <div class="site-info">
                <h1 class="site-name"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
                {{ with .Site.Params.description }}
                <p class="site-description">{{ . }}</p>
                {{ end }}
            </div>
        </header>

        <nav>
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
        </nav>
    </div>
</div>
