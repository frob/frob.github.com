baseURL = "https://example.org/"
languageCode = "en-us"
title = "My Hugo Site"
theme = "frobiovox"
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"

[params]
  description = "A blog using the Frobiovox theme"
  descriptions = [
    "A blog using the Frobiovox theme",
    "Notes from the terminal",
    "Quietly building things",
    "Static site, dynamic mind",
    "Where the cursor still blinks",
    "Long-form for short attention spans",
    "Compile, commit, caffeinate, repeat",
    "Words about code, mostly",
    "Reading the docs so you don't have to",
    "A few opinions, lightly held",
    "Hand-rolled, no batteries included",
    "Postcards from production",
  ]
  description_rotation_ms = 19000
  avatar = "/images/avatar.png"
  github = "yourusername"
  twitter = "yourusername"

  [params.author]
    name = "Your Name"
    url = ""

  [[params.blogroll]]
    name = "Example Blog"
    url = "https://example.com"

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFULL]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true

[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFULL"]
  section = ["HTML", "RSS", "MARKDOWN"]
  page = ["HTML", "MARKDOWN"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[[menu.main]]
  name = "Blog"
  url = "/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2

[[menu.main]]
  name = "Style Guide"
  url = "/styleguide/"
  weight = 3
