<div class="wrapper-masthead">
    <div class="container">
        <header class="masthead clearfix">
            {{ with .Site.Params.avatar }}
            <a href="{{ "/" | relURL }}" class="site-avatar"><img src="{{ . }}" /></a>
            {{ end }}

            <div class="site-info">
                <h1 class="site-name"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
                {{ with .Site.Params.description }}
                <p class="site-description">{{ . }}</p>
                {{ end }}
            </div>
        </header>
    </div>

    <nav class="navigation-menu">
        <ul class="navigation-menu-list container">
            {{ range .Site.Menus.main }}
            <li class="navigation-menu-item">
                <a class="navigation-menu-link" href="{{ .URL }}">{{ .Name }}</a>
            </li>
            {{ end }}
        </ul>
    </nav>
</div>
