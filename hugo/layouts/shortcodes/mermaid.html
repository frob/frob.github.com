{{- $content := .Inner | safeHTML -}}
<div class="mermaid-wrap"><pre class="mermaid">{{ $content }}</pre></div>
{{- if not (.Page.Store.Get "hasMermaid") -}}
{{- .Page.Store.Set "hasMermaid" true -}}
<style>
.mermaid-wrap{max-width:100%;margin:2rem auto;text-align:center;overflow-x:auto}
.mermaid-wrap pre.mermaid{background:transparent;padding:0;margin:0;white-space:normal;font-family:inherit}
</style>
{{- end -}}
