{{- $content := .Inner | safeHTML -}}
<div class="mermaid-wrap"><pre class="mermaid">{{ $content }}</pre></div>
{{- if not (.Page.Store.Get "hasMermaid") -}}
{{- .Page.Store.Set "hasMermaid" true -}}
<style>
.mermaid-wrap{max-width:100%;margin:2rem auto;text-align:center;overflow-x:auto}
.mermaid-wrap pre.mermaid{background:transparent;padding:0;margin:0;white-space:normal;font-family:inherit}
</style>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({
  startOnLoad: true,
  theme: 'base',
  themeVariables: {
    background: '#eee',
    primaryColor: '#222',
    primaryTextColor: '#eee',
    primaryBorderColor: '#000',
    secondaryColor: '#fff',
    secondaryTextColor: '#222',
    secondaryBorderColor: '#222',
    tertiaryColor: '#eee',
    tertiaryTextColor: '#333',
    lineColor: '#666',
    textColor: '#333',
    fontFamily: '"Raleway", Helvetica, Arial, sans-serif',
    fontSize: '15px',
    actorBkg: '#222',
    actorTextColor: '#eee',
    actorBorder: '#000',
    actorLineColor: '#666',
    actorFontFamily: '"VT323", "Helvetica Neue", Helvetica, Arial, sans-serif',
    actorFontSize: '18px',
    signalColor: '#333',
    signalTextColor: '#333',
    labelBoxBkgColor: '#fff',
    labelBoxBorderColor: '#222',
    noteBkgColor: '#fff',
    noteTextColor: '#333',
    noteBorderColor: '#666'
  }
});
</script>
{{- end -}}
